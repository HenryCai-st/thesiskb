[project]
name = "thesiskb"
version = "0.1.0"
description = "Private, multimodal knowledge base with verified, cited retrieval."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "litellm>=1.50",
    "mcp>=2.3",
    "pgvector>=0.3",
    "pillow>=10.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# GPU/ML stack for real ingestion and reranking (pulls torch; not needed for CI)
local = [
    "docling>=2.40",
    "faster-whisper>=1.1",
    "pyannote.audio>=4.0",
    "sentence-transformers>=3.0",
    "torch>=2.7",
]

[project.scripts]
tkb = "thesiskb.cli:app"

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thesiskb"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# typer and FastAPI declare options/dependencies as default-argument calls
extend-immutable-calls = [
    "typer.Argument", "typer.Option",
    "fastapi.Depends", "fastapi.Query", "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
# prompt templates are prose
"src/thesiskb/answer/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA GPU and real models (skipped in CI)",
    "db: needs a running Postgres with pgvector (TKB_DATABASE_URL)",
    "integration: real parsers on CPU with synthetic files (uv run pytest -m integration)",
]
addopts = "-m 'not gpu and not integration'"
