services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: thesiskb-postgres
    environment:
      POSTGRES_USER: thesiskb
      POSTGRES_PASSWORD: thesiskb
      POSTGRES_DB: thesiskb
    ports:
      - "${TKB_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thesiskb -d thesiskb"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
