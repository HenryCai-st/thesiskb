# Gold questions for `tkb eval` (BUILD_GUIDE §8). Milestone 0 fixture set.
#
# expected_sources: original filenames under data/raw/ (the eval resolves them to sources by sha256).
# type:   literature | person | task | comparison | general
# path:   which router path should answer it (Milestone 6); lists mean multi-path.
# expected_facts: short facts a correct answer must contain (checked by an LLM judge).
# expected_tasks: for task questions, rows the extraction must produce (recall is measured on these).
# Video/audio facts and quote times come from the YouTube subtitles (.txt/.vtt) in data/reference/
# (checked by the user against the video). data/reference/ is for grading only, never ingested.
# Whisper vs VTT (eval/calibrate_vtt.py): median |offset| 0.42 s (audio) / 0.16 s (video),
# no systematic shift, so no timestamp correction is applied.

fixtures:
  survey: 2209.00796v15.pdf                      # Yang et al., "Diffusion Models: A Comprehensive Survey..." (59 p.)
  schedule: 5389068047127093167.jpg              # handwritten thesis timeline, photo rotated 90°
  jetson_video: YTDown.com_YouTube_Media_S9L2WGf1KrM_Introducing-NVIDIA-Jetson-Orin-Nano-Super-The-World-s-Most-Affordable-Generative_001_1080p.mp4
  dgx_audio: "Sparking Something Big_ NVIDIA DGX Spark Has Arrived.mp3"
  sample_epub: minimal.epub                      # "Sample .epub Book": 2 lorem-ipsum chapters + copyright page
  sideby_html: "SideBy _ Vivien Cai Portfolio.html"  # saved page of viviencai.com/projects/sideby
  granola_csv: granola-export-test.csv           # Granola export: AI summary + transcript per meeting (ingested from M13)

questions:
  # --- Literature (Q1 type) ---
  - id: lit-01
    question: How is diffusion model developing?
    type: literature
    path: literature
    expected_sources: [survey]
    expected_facts:
      - Three foundational formulations - DDPMs, score-based generative models (SGMs), score SDEs
      - Improvement directions - efficient sampling, improved likelihood, special data structures
      - Applications across vision, NLP, multimodal, temporal data, science
    notes: Broad synthesis; answer must say it only covers what is in the KB.

  - id: lit-02
    question: What methods does the survey list for making diffusion sampling faster?
    type: literature
    path: literature
    expected_sources: [survey]
    expected_facts:
      - Learning-free sampling (SDE/ODE solvers) and learning-based sampling (e.g. distillation)

  # --- Cross-modal comparison (video + audio) ---
  - id: cmp-01
    question: What is the difference between Jetson Orin Nano Super and DGX Spark?
    type: comparison
    path: [general]
    expected_sources: [jetson_video, dgx_audio]
    expected_facts:
      - Orin Nano Super - almost 70 trillion operations per second, 25 W, $249
      - Orin Nano Super - aimed at robotics / edge; runs CUDA, LLMs, agentic AI
      - DGX Spark - a personal supercomputer on your desk for developers, researchers, students
      - DGX Spark - runs large state-of-the-art open models locally without data-center GPUs
      - The KB gives no price or specs for DGX Spark; the answer must say so instead of guessing
    notes: Citations must carry timestamps from both recordings.

  - id: cmp-02
    question: What is the difference between Jetson Nano and DGX Spark?
    type: comparison
    path: [general]
    expected_sources: [jetson_video, dgx_audio]
    expected_facts: same_as:cmp-01
    notes: >
      Robustness variant with the loose name the speaker himself uses ("Jetson Nano super").
      The answer should resolve "Jetson Nano" to the Orin Nano Super in the video and may note
      the naming difference; it must not bring in original Jetson Nano specs from model memory.

  # --- Task / schedule (Q3 type: SQL over extracted tasks, not free generation) ---
  - id: task-01
    question: Show me the schedule of my thesis
    type: task
    path: task
    expected_sources: [schedule]
    expected_tasks:
      - {description: Thesis proposal, due_raw: "10.10.2026", due_date: 2026-10-10}
      - {description: Start thesis, due_raw: "Nov", due_date: 2026-11-30}
      # undated recurring item written under "Start thesis" (was merged into it until M5)
      - {description: Weekly meeting with supervisor}
      - {description: Mid-term presentation, due_raw: "Jan 2027", due_date: 2027-01-31}
      - {description: Final, due_raw: "March", due_date: 2027-03-31}
      - {description: Submission, due_raw: "05.2027", due_date: 2027-05-31}
    notes: >
      Month-only dates resolve to end of month; year inferred from neighbouring entries.
      Owner is the user (thesis author). Tests OCR/VLM on handwriting and a rotated photo.

  - id: task-02
    question: When is my mid-term presentation?
    type: task
    path: task
    expected_sources: [schedule]
    expected_facts: [January 2027]

  # --- Audience / general question answered from one recording ---
  - id: gen-01
    question: What kind of people (should) like to use DGX Spark?
    type: general
    path: [general]
    expected_sources: [dgx_audio]
    expected_facts:
      - Developers who want to run the biggest models but are limited by their hardware
      - Researchers, artists and innovators; AI labs at universities (ASU, NYU)
      - Graduate students in AI ("should have one on their desk")
      - Robotics / edge-AI teams that simulate and fine-tune models for edge devices (e.g. Zipline)
    notes: Answer should quote the audio with timestamps.

  # --- Person-centric (Q2 type) ---
  - id: person-01
    question: Who is Will.i.am and what does he say about DGX Spark?
    type: person
    path: person
    expected_sources: [dgx_audio]
    expected_facts:
      - Introduces himself as a musician, creator, producer, technocrat, futurist
      - He now has a Spark and can take it with him everywhere he goes
    # Milestone 4 acceptance: quote attributed to the right speaker, timestamp within ±5 s.
    # Times from the YouTube VTT (eval/calibrate_vtt.py), independent of Whisper.
    expected_quotes:
      - {speaker: Will.i.am, t: 21.5}   # VTT "My name is"; Whisper 22.8
    notes: >
      Tests speaker resolution: the audio has several unnamed speakers, and only the
      self-introduction ties one diarization label to "Will.i.am". Quotes from other speakers
      must not be attributed to him. Needs `tkb speakers label Sparking SPEAKER_xx "Will.i.am"`
      (Whisper spells him "Will I.M.").

  - id: video-01
    question: How much does the Jetson Orin Nano Super cost and how fast is it?
    type: general
    path: [general]
    expected_sources: [jetson_video]
    expected_facts: ["$249", almost 70 trillion operations per second, 25 W]
    expected_quotes:
      - {t: 81.8}   # VTT "trillion operations"; Whisper 81.5
    expect_keyframe: true

  # --- Relation questions (Milestone 6: decide whether a graph layer is needed) ---
  - id: rel-01
    question: How are diffusion models connected to other generative models such as VAEs, GANs and normalizing flows?
    type: relation
    path: literature
    expected_sources: [survey]
    expected_facts:
      - The survey has a section on connections with LLMs, VAEs, GANs, normalizing flows, autoregressive and energy-based models
    notes: Relations inside one paper; plain retrieval should find section 6.

  - id: rel-02
    question: Which NVIDIA products appear in my sources, and what is each one for?
    type: relation
    path: entity        # was general; failed there (refused) — see ADR 0007
    expected_sources: [jetson_video, dgx_audio]
    expected_facts:
      - Jetson Orin Nano Super - small AI computer for robotics / edge, $249
      - DGX Spark - personal AI supercomputer on the desk for developers and researchers
    notes: >
      Aggregation across sources (entity-centric). The entities/relations tables hold both
      products; this tests whether retrieval alone gathers them or a graph lookup is needed.

  # --- Page-less documents (Milestone 11) and meeting exports (Milestone 13) ---
  - id: epub-01
    question: What is the difference between chapter 1 and chapter 2?
    type: general
    path: [general]     # the question names no book; general search covers books too
    expected_sources: [sample_epub]
    expected_facts:
      - Both chapters contain only placeholder "Lorem ipsum" text, so there is no difference in content
      - Each chapter is cited separately (Chapter 1 and Chapter 2)
    notes: Tests EPUB ingest; citations must name the chapter, not a page.

  - id: web-01
    question: >
      Based on the SideBy project page, what problem does the project aim to solve, how does
      the proposed design address that problem, and how do the images or videos demonstrate
      the solution?
    type: general
    path: [general]
    expected_sources: [sideby_html]
    expected_facts:
      - Problem - therapy feels intimidating/overwhelming at the start; fear of judgment and stigma keep people from seeking help (depression affects over 280 million people)
      - Design - an app built on empowerment, connection, encouragement and simplicity (self-disclosure, goal setting, progress, low cognitive load) that supports people before and during therapy and connects them with therapists
      - Images - process visuals (scenario maps, low/mid-fidelity wireframes, final screens such as safe space, mood, summary, therapist dashboard) show how the flow was developed
    notes: >
      Saved copy of a live page (layout broken, assets in the _files folder). Images are
      represented by their alt text/captions; the three videos are hosted on the site and are
      not in the saved copy (whole-site/URL ingest is Milestone 17).

  - id: granola-01
    question: >
      What did the team decide regarding the scope of their Bachelor project - developing a
      universal Strategic Foresight framework versus focusing on a concrete use case - and
      which specific topic and target group did they select to move forward with?
    type: general
    path: [general]
    expected_sources: [granola_csv]
    expected_facts:
      - Start with one concrete use case, apply all methods to it, and abstract to a framework later if possible
      - Topic - "KI am Arbeitsplatz" (AI at the workplace)
      - Target group - Berufseinsteiger (entry-level / junior workers)
    notes: Skipped until CSV ingest exists (Milestone 13).
